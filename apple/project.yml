# XcodeGen spec. Generate the Xcode project with:
#   brew install xcodegen && cd apple && xcodegen generate && open Overload.xcodeproj
name: Overload
options:
  bundleIdPrefix: cz.martinpohl
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your team in Xcode (Signing & Capabilities) or here; never commit certificates.
    DEVELOPMENT_TEAM: GR59NF57R2
    CODE_SIGN_STYLE: Automatic
targets:
  Overload:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.martinpohl.overload
        PRODUCT_NAME: Overload
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Overload
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
    dependencies:
      - target: OverloadWatch
  OverloadWatch:
    type: application
    platform: watchOS
    sources:
      - path: Shared
      - path: watchOS
    entitlements:
      path: watchOS/OverloadWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cz.martinpohl.overload.watchkitapp
        PRODUCT_NAME: Overload
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Overload
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: cz.martinpohl.overload
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_NSHealthShareUsageDescription: Overload reads your heart rate and active energy during a workout.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Overload saves your strength workouts to the Health app.
    info:
      path: watchOS/Info.plist
      properties:
        WKBackgroundModes: [workout-processing]
